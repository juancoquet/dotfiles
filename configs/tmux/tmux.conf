# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0


# status bar
set -g status-position top
set -g status-justify left
set -g status-left-length 200
set -g status-right '#{prefix_highlight}'
## solarized colors
set -g status-style 'bg=default' # transparent
set -g status-left '#[fg=#586e75]   #S |  '
set -g window-status-current-format '#[fg=#2aa198,bold]*#I  #W '
set -g window-status-format '#[fg=#586e75]#I #W '
set -g @prefix_highlight_fg '#b58900' # default is 'colour231'
set -g @prefix_highlight_bg 'default'  # default is 'colour04'
set -g @prefix_highlight_prefix_prompt ''


# tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
unbind -n C-\\

# tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'  # basic tmux settings everyone can agree on
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank'      # copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # highlight when prefix is pressed

# plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
